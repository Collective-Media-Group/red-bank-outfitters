# Astro static build; redirects live in public/_redirects.
[build]
  publish = "dist"
  command = "npm run build"

# Long-lived binaries.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
